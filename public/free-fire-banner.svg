<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 560" role="img" aria-labelledby="title desc">
<title id="title">7 April Store — Free Fire Top Up</title>
<desc id="desc">Banner gaming futuristik biru neon dengan karakter pejuang, kristal diamond dan arena battle royale.</desc>
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020817"/><stop offset=".42" stop-color="#071b48"/><stop offset=".76" stop-color="#092d68"/><stop offset="1" stop-color="#030b20"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#147de8" stop-opacity=".7"/><stop offset=".55" stop-color="#0753bd" stop-opacity=".25"/><stop offset="1" stop-color="#00112e" stop-opacity="0"/></radialGradient>
