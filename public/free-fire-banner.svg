 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ce9ff"/><stop offset="1" stop-color="#795bff"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#4ebcff" stroke-opacity=".12" stroke-width="1"/></pattern>
